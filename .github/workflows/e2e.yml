name: E2E

# Runs test/e2e.test.mjs against the Gitea server in the GITEA_E2E_URL repository variable,
# using the GITEA_E2E_TOKEN repository secret. It does not run on pull requests: a pull
# request from a branch in this repository could change the test to print the secret.
# See ADR-0006.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, and never cut a run off while it holds a throwaway repository.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job holds a secret, and release.yml skips the cache for the same reason.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test test/e2e.test.mjs
        env:
          GITEA_E2E_URL: ${{ vars.GITEA_E2E_URL }}
          GITEA_E2E_TOKEN: ${{ secrets.GITEA_E2E_TOKEN }}
          E2E_REQUIRED: 'true'
